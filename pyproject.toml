[project]
name = "openbb-wmshare"
version = "0.1.0"
description = "OpenBB Platform provider for wmshare: A-share / Hong Kong / US market data, financial statements, dividends and indices."
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11,<4"
authors = [{ name = "wmshare contributors" }]
keywords = [
  "openbb",
  "provider",
  "wmshare",
  "a-share",
  "hong-kong",
  "finance",
  "market-data",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "openbb-core[pandas]>=2.0.1,<3",
  "openbb-equity>=2.0.0",
  "openbb-index>=2.0.0",
  "wmshare>=1.19,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/open-winmale/wmshare"
Source = "https://github.com/open-winmale/openbb-wmshare"
Issues = "https://github.com/open-winmale/openbb-wmshare/issues"

[project.entry-points."openbb_provider_extension"]
wmshare = "openbb_wmshare:wmshare_provider"

[project.entry-points."openbb_core_extension"]
wmshare = "openbb_wmshare.wmshare_router:router"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openbb_wmshare"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
  "E501",
  # OpenBB's Data/QueryParams contract requires class-level dict attributes
  # (__alias_dict__, __json_schema_extra__) declared as plain assignments.
  "RUF012",
]

[tool.pytest.ini_options]
testpaths = ["tests", "integration"]
addopts = "-q"
markers = [
  "integration: hits the live wmshare API; requires WMSHARE_CLIENT_ID / WMSHARE_CLIENT_SECRET",
]
